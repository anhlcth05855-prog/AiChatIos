name: Build iOS (PrivateLLM)

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode.app/Contents/Developer || true
          xcodebuild -version

      - name: Build iOS Simulator (Debug)
        run: |
          xcodebuild \
            -project PrivateLLM/PrivateLLM.xcodeproj \
            -scheme PrivateLLM \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Build iOS Device Unsigned App (Release)
        run: |
          xcodebuild \
            -project PrivateLLM/PrivateLLM.xcodeproj \
            -scheme PrivateLLM \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build

      - name: Package Unsigned IPA
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/PrivateLLM.app Payload/
          zip -r PrivateLLM-unsigned.ipa Payload

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: PrivateLLM-iOS-Build
          path: PrivateLLM-unsigned.ipa
