name: Build iOS (PrivateLLM)

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Inspect Xcode and Project
        run: |
          xcodebuild -version
          plutil -lint PrivateLLM/PrivateLLM.xcodeproj/project.pbxproj
          xcodebuild -project PrivateLLM/PrivateLLM.xcodeproj -list

      - name: Build iOS Simulator (Debug)
        run: |
          set -o pipefail
          if ! xcodebuild \
            -project PrivateLLM/PrivateLLM.xcodeproj \
            -scheme PrivateLLM \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO \
            build 2>&1 | tee sim-build.log; then
            echo "::error::$(grep -E 'error:|fatal error:|xcodebuild: error:' sim-build.log | head -n 15 | tr '\n' ' ')"
            exit 1
          fi

      - name: Build iOS Device Unsigned App (Release)
        run: |
          set -o pipefail
          if ! xcodebuild \
            -project PrivateLLM/PrivateLLM.xcodeproj \
            -scheme PrivateLLM \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build 2>&1 | tee ios-build.log; then
            echo "::error::$(grep -E 'error:|fatal error:|xcodebuild: error:' ios-build.log | head -n 15 | tr '\n' ' ')"
            exit 1
          fi

      - name: Package Unsigned IPA
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/PrivateLLM.app Payload/
          zip -r PrivateLLM-unsigned.ipa Payload

      - name: Upload Build Logs on Failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: xcodebuild-logs
          path: |
            sim-build.log
            ios-build.log

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: PrivateLLM-iOS-Build
          path: PrivateLLM-unsigned.ipa
